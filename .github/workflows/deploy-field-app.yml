name: Deploy field app to Cloudflare Workers

on:
  push:
    # The working branch is included deliberately. GitHub only shows the
    # "Run workflow" button for workflows that exist on the DEFAULT branch, so
    # until this is merged to main, workflow_dispatch is not clickable. A push
    # trigger on this branch is what actually makes it run before the merge.
    branches: [main, 'claude/roof-iq-upgrades-x6mtjh']
    paths: ['web/**', '.github/workflows/deploy-field-app.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        env:
          # Optional. The app has working defaults compiled in, so leaving these
          # unset builds against the roofiq-ai project. Set them only to point a
          # build at a different Supabase project. They are variables rather than
          # secrets because the publishable key ships in the browser bundle
          # anyway; RLS, not secrecy, is what guards the data.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Workers with static assets, per Cloudflare's migration guidance.
          # `wrangler deploy` reads web/wrangler.jsonc; never `pages deploy`.
          command: deploy
