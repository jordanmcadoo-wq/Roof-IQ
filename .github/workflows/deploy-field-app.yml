name: Deploy field app to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-field-app.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        env:
          # Not secrets in any meaningful sense: the publishable key is designed
          # to ship in the browser bundle, and row-level security is what guards
          # the data. They live in repo settings so the URL and key can change
          # without a code edit.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Workers with static assets, per Cloudflare's migration guidance.
          # `wrangler deploy` reads web/wrangler.jsonc; never `pages deploy`.
          command: deploy
